  <path class="line" stroke-width="1.5" d="M3.6 29.1 7.9 24.7c4.6-5 9.3-10.6 14.6-15.8"/>
  <path class="line" stroke-width="1.1" d="M11.3 20.2l-.7-4.6M15.1 16.2l-.3-5.1M18.8 12.4l.2-3.9M11.3 20.2l4.8.8M15.1 16.2l5.2.3M18.8 12.4l4.3-.2"/>
