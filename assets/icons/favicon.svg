<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A small pencil-drawn leaf. Strokes wobble a little so it reads as hand-drawn. -->
  <style>
    .wash { fill: #8fa58a; fill-opacity: .45; }
