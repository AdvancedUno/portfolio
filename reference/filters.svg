<!--
  Reference filters for "A Field Guide to Uno".
  Origin: a filter study prototyped in chat. Port these into the site and tune them.
  Masks assume a 720x960 image in user space; generalize them per image size.
  Apply to an SVG <image> with filter="url(#pencil)" mask="url(#mask-pencil)"
  or filter="url(#watercolor)" mask="url(#mask-watercolor)".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Pencil: grayscale, invert, blur, color-dodge (the classic sketch trick), then darken and add grain -->
    <filter id="pencil" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="inv">
        <feFuncR type="table" tableValues="1 0"/><feFuncG type="table" tableValues="1 0"/><feFuncB type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="3.2" result="blur"/>
      <feBlend in="blur" in2="gray" mode="color-dodge" result="dodge"/>
      <feComponentTransfer in="dodge" result="dark">
        <feFuncR type="gamma" exponent="2.6"/><feFuncG type="gamma" exponent="2.6"/><feFuncB type="gamma" exponent="2.6"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".22 0 0 0 .8  .22 0 0 0 .8  .22 0 0 0 .8  0 0 0 0 1" result="grain"/>
      <feBlend in="dark" in2="grain" mode="multiply" result="grainy"/>
      <feColorMatrix in="grainy" type="matrix" values=".9 0 0 0 .04  0 .92 0 0 .04  0 0 .9 0 .05  0 0 0 1 0"/>
    </filter>

    <!-- Watercolor: wobble, soften, posterize into washes, darken pigment edges, lighten, add paper grain -->
    <filter id="watercolor" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".013" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="16" xChannelSelector="R" yChannelSelector="G" result="wobbled"/>
      <feGaussianBlur in="wobbled" stdDeviation="3" result="blurred"/>
      <feComponentTransfer in="blurred" result="soft">
        <feFuncR type="gamma" exponent=".72"/><feFuncG type="gamma" exponent=".72"/><feFuncB type="gamma" exponent=".75"/>
      </feComponentTransfer>
      <feComponentTransfer in="soft" result="steps">
        <feFuncR type="discrete" tableValues=".1 .3 .46 .6 .72 .83 .92 .98"/>
        <feFuncG type="discrete" tableValues=".1 .3 .46 .6 .72 .83 .92 .98"/>
        <feFuncB type="discrete" tableValues=".1 .3 .46 .6 .72 .83 .92 .98"/>
      </feComponentTransfer>
      <feComposite in="steps" in2="soft" operator="arithmetic" k2=".6" k3=".4" result="washes"/>
      <feColorMatrix in="washes" type="saturate" values=".85" result="muted"/>
      <feConvolveMatrix in="washes" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" preserveAlpha="true" result="edges"/>
      <feColorMatrix in="edges" type="matrix" values="-.22 -.22 -.22 0 1  -.22 -.22 -.22 0 1  -.22 -.22 -.22 0 1  0 0 0 0 1" result="pigment"/>
      <feBlend in="muted" in2="pigment" mode="multiply" result="pooled"/>
      <feComponentTransfer in="pooled" result="airy">
        <feFuncR type="linear" slope=".74" intercept=".25"/><feFuncG type="linear" slope=".74" intercept=".25"/><feFuncB type="linear" slope=".74" intercept=".23"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="3" seed="11" result="paper"/>
      <feColorMatrix in="paper" type="matrix" values=".3 0 0 0 .74  .3 0 0 0 .74  .3 0 0 0 .73  0 0 0 0 1" result="tooth"/>
      <feBlend in="airy" in2="tooth" mode="multiply"/>
    </filter>

    <!-- Ragged edges for the masks, so sketches bleed into the paper instead of ending in a hard rectangle -->
    <filter id="ragged" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="4" seed="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="54" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="ragged-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <mask id="mask-watercolor" maskUnits="userSpaceOnUse" x="0" y="0" width="720" height="960">
      <rect x="44" y="44" width="632" height="872" fill="#fff" filter="url(#ragged)"/>
    </mask>
    <mask id="mask-pencil" maskUnits="userSpaceOnUse" x="0" y="0" width="720" height="960">
      <rect x="30" y="30" width="660" height="900" fill="#fff" filter="url(#ragged-soft)"/>
    </mask>
  </defs>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
